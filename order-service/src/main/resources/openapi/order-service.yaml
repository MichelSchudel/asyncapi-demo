openapi: 3.1.0
info:
  title: Order Service API
  description: Accepts orders and publishes OrderCreated events
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Generated server url
tags:
  - name: Orders
    description: Place orders that are published as OrderCreated events
paths:
  /orders:
    post:
      tags:
        - Orders
      summary: Place a new order
      description: Generates an order id and publishes an OrderCreated event
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order accepted and OrderCreated event published
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
        '400':
          description: Invalid order payload
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
components:
  schemas:
    OrderItem:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
      required:
        - productId
        - quantity
    OrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
      required:
        - items
    OrderCreatedResponse:
      type: object
      properties:
        id:
          type: string
