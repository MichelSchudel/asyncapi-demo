asyncapi: 3.0.0
info:
  title: Order events (shared contract)
  version: 1.0.0
  description: >
    Shared channel and message definitions for order events.
    Owned by the Order Service team. Each service that produces
    or consumes OrderCreated events keeps its own local copy of
    this file so it stays self-contained; see order-events-send.yaml
    (order-service) and order-events-receive.yaml (stock-service)
    for how each service refs its own copy.

channels:
  orderCreated:
    address: orders.created
    messages:
      OrderCreated:
        $ref: '#/components/messages/OrderCreated'

components:
  messages:
    OrderCreated:
      summary: Information about a created order.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Order'
      examples:
        - payload:
            id: "f1451166-a896-4f02-a741-69a51b19b277"
            source: CUSTOMER
            items:
              - productId: "12346"
                quantity: 1

  schemas:
    Order:
      title: OrderCreated
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique identification of the order.
        source:
          $ref: '#/components/schemas/OrderSource'
        items:
          type: array
          description: The items that make up this order.
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
        - id
        - source
        - items
    OrderSource:
      title: OrderSource
      type: string
      description: Origin that raised the order.
      enum:
        - CUSTOMER
        - WAREHOUSE
    OrderItem:
      title: OrderItem
      type: object
      additionalProperties: false
      properties:
        productId:
          type: string
          description: Unique identification of the product being ordered.
        quantity:
          type: integer
          description: Quantity of the product being ordered.
          minimum: 1
          maximum: 10
      required:
        - productId
        - quantity
